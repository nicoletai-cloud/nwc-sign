<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="好好禮車｜線上簽署合約">
<meta property="og:description" content="請點開確認合約內容，並完成線上簽名。">
<title>好好禮車｜線上簽署合約</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400&display=swap">
<style>
:root{--gold:#A77D4C;--ink:#343A35;--mu:#75736B;--bg:#EFECE6;--line:#DDD6CA}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-family:"Noto Serif TC",serif;font-weight:400;color:var(--gold);font-size:20px;letter-spacing:.04em}
header span{color:var(--mu);font-size:13px}
.msg{max-width:820px;margin:14px auto 0;padding:0 16px;font-size:14px;line-height:1.6;color:var(--mu)}
.msg.ok{color:#2F6B4F}.msg.err{color:#A0453A}
#doc{margin:12px auto 140px;width:794px;transform-origin:top left}
#doc .ct2 .pg{box-shadow:0 4px 24px rgba(0,0,0,.08);margin:0 0 16px}
#doc .sgn img{display:block;height:46pt;max-width:240pt;object-fit:contain}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:center;z-index:6}
.bar .row{display:flex;gap:10px;width:100%;max-width:520px}
.bar label{font-size:14px;display:flex;gap:8px;align-items:flex-start;max-width:520px;width:100%;line-height:1.5}
.bar input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--gold);flex:none}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:13px 16px;font-size:16px;cursor:pointer;flex:1}
button.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:default}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.pad{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pad h3{margin:0;font-size:17px}.pad p{margin:0;color:var(--mu);font-size:13px}
.cv{position:relative;border:1.5px dashed var(--line);border-radius:10px;background:#FBF9F5;height:min(46vh,260px);touch-action:none}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cv i{position:absolute;left:16px;right:16px;bottom:28%;border-bottom:1px solid var(--line);pointer-events:none}
.cv em{position:absolute;left:16px;bottom:calc(28% + 6px);font-style:normal;color:#C9C2B6;font-size:13px;pointer-events:none}
.pad .row{display:flex;gap:10px}
</style>
</head>
<body>
<header><b>好好禮車</b><span>禮車預約單暨合約書｜線上簽署</span></header>
<div class="msg" id="msg">合約載入中…</div>
<div id="doc"></div>

<div class="bar" id="bar" hidden>
  <label id="agreeRow" hidden><input type="checkbox" id="agree">我已詳細閱讀並同意以上合約內容</label>
  <div class="row" id="rowSign"><button class="pri" id="btnSign">簽名完成合約</button></div>
  <div class="row" id="rowSubmit" hidden><button id="btnRedo">重新簽名</button><button class="pri" id="btnSubmit" disabled>確認送出</button></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="pad">
    <h3>請在下方框內簽名</h3>
    <p>用手指（手機、平板）或滑鼠簽名，簽完按「套用到合約」。</p>
    <div class="cv"><canvas id="cv"></canvas><i></i><em>簽名處</em></div>
    <div class="row"><button id="btnClear">清除</button><button id="btnCancel">取消</button><button class="pri" id="btnApply" disabled>套用到合約</button></div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const GAS='AKfycbwoKk13j5YOtkA5cTh3FtvECekYm0uMBPsid1H--kB7bhUVpDFvSnSA0iTzCfc8IT11_Q';
const q=new URLSearchParams(location.search),sid=q.get('s')||GAS,key=q.get('k')||(location.pathname.split('/').filter(Boolean).pop()||'');
const API=sid?'https://script.google.com/macros/s/'+encodeURIComponent(sid)+'/exec':'';
let sigData='';
function msg(t,cls){const m=$('msg');m.className='msg'+(cls?' '+cls:'');m.innerHTML=t}
function fit(){const d=$('doc'),w=Math.min(window.innerWidth-16,820),z=Math.min(1,w/794);d.style.zoom=z;d.style.marginLeft=d.style.marginRight='auto'}
window.addEventListener('resize',fit);
function render(html){const doc=new DOMParser().parseFromString(html,'text/html');const d=$('doc');d.innerHTML='';
  doc.querySelectorAll('style').forEach(s=>{if(!/@page/.test(s.textContent))d.appendChild(s.cloneNode(true))});
  doc.body.childNodes.forEach(n=>d.appendChild(document.importNode(n,true)));fit()}
async function load(){
  if(!API||!key){msg('連結不完整，請向好好禮車索取新的簽署連結。','err');return}
  try{const r=await fetch(API+'?action=sign&k='+encodeURIComponent(key));const j=await r.json();
    if(!j.ok){msg(j.error||'找不到這份合約，請向好好禮車索取新的簽署連結。','err');return}
    render(j.html);
    if(j.signedAt){done(j.signedAt,j.pdf);return}
    msg('請詳細閱讀以下合約內容（訂單編號 '+String(j.orderNo||'').replace(/[<>&]/g,'')+'），確認無誤後按下方「簽名完成合約」。');
    $('bar').hidden=false}
  catch(e){msg('合約載入失敗，請確認網路後重新整理頁面。','err')}}
function done(at,pdf){$('bar').hidden=true;const t=new Date(at).toLocaleString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  msg('✅ 此合約已於 '+t+' 完成簽署，謝謝您！'+(pdf?' <a href="'+encodeURI(pdf)+'" target="_blank" rel="noopener">下載已簽署合約 PDF</a>':''),'ok')}

/* ---- signature pad ---- */
const cv=$('cv'),ctx=cv.getContext('2d');let drawing=false,inked=false,last=null;
function sizePad(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1F1B18';inked=false;$('btnApply').disabled=true}
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||.5}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,7);ctx.fillStyle='#1F1B18';ctx.fill()});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.lineWidth=e.pointerType==='pen'?1.4+p.p*2.4:2.6;
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!inked){inked=true;$('btnApply').disabled=false}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{drawing=false}));
function trimmed(){const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return '';const pad=12;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);
  const sc=Math.min(1,600/(x1-x0)),o=document.createElement('canvas');o.width=Math.round((x1-x0)*sc);o.height=Math.round((y1-y0)*sc);
  o.getContext('2d').drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);return o.toDataURL('image/png')}
function openPad(){$('modal').hidden=false;requestAnimationFrame(sizePad)}
$('btnSign').onclick=openPad;$('btnRedo').onclick=openPad;
$('btnCancel').onclick=()=>{$('modal').hidden=true};
$('btnClear').onclick=sizePad;
$('btnApply').onclick=()=>{const u=trimmed();if(!u)return;sigData=u;$('modal').hidden=true;
  const box=document.querySelector('#doc .sgn');if(box){box.innerHTML='';const im=new Image();im.src=u;im.alt='租車人簽名';box.appendChild(im);box.scrollIntoView({behavior:'smooth',block:'center'})}
  $('rowSign').hidden=true;$('rowSubmit').hidden=false;$('agreeRow').hidden=false;upd()};
function upd(){$('btnSubmit').disabled=!(sigData&&$('agree').checked)}
$('agree').onchange=upd;
$('btnSubmit').onclick=async()=>{const b=$('btnSubmit');b.disabled=true;b.textContent='送出中…';$('btnRedo').disabled=true;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'signSubmit',k:key,img:sigData})});const j=await r.json();
    if(!j.ok)throw new Error(j.error||'送出失敗');let at=j.signedAt,pdf=j.pdf;if(!at){try{const g=await (await fetch(API+'?action=sign&k='+encodeURIComponent(key))).json();at=g.signedAt;pdf=g.pdf}catch(e){}}done(at||Date.now(),pdf);window.scrollTo({top:0,behavior:'smooth'})}
  catch(e){msg('送出失敗：'+String(e.message||e).replace(/[<>&]/g,'')+'，請稍後再試一次。','err');b.textContent='確認送出';$('btnRedo').disabled=false;upd()}};
load();
})();
</script>
</body>
</html>
